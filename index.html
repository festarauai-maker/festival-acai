<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>10º Festival do Açaí - Arauaí</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4eef8;color:#2b1636;padding-bottom:90px}
h1,h2,.fd{font-family:'Fredoka',Arial,sans-serif}
header{background:linear-gradient(160deg,#3d0f57,#7d3aa0);color:#fff;padding:26px 16px 30px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 4px 14px rgba(61,15,87,.35)}
header h1{margin:0;font-size:26px;line-height:1.15;font-weight:700}
header p{margin:8px 0 0;font-family:'Fredoka',Arial,sans-serif;font-size:16px;opacity:.9}
#chips{position:sticky;top:0;z-index:4;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:rgba(244,238,248,.96);-webkit-overflow-scrolling:touch;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:#fff;color:#5b1f7a;font-family:'Fredoka',Arial,sans-serif;font-size:15px;padding:9px 18px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.chip.on{background:#5b1f7a;color:#fff}
main{max-width:600px;margin:auto;padding:4px 12px}
h2{color:#5b1f7a;margin:18px 0 8px;font-size:20px;scroll-margin-top:70px}
.it{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:12px;border-radius:14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.nm{font-weight:bold;font-size:15px}
.nm span{font-size:13px;color:#777;font-weight:normal;display:block;margin-top:2px}
.ctl{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.qn{min-width:18px;text-align:center;font-size:16px}
button{font:inherit;cursor:pointer}
.add{background:#5b1f7a;color:#fff;border:0;border-radius:50%;width:36px;height:36px;font-size:22px;line-height:1}
.mn{background:#fff;color:#5b1f7a;border:2px solid #5b1f7a;border-radius:50%;width:36px;height:36px;font-size:22px;line-height:1}
#bar{position:fixed;bottom:0;left:0;right:0;padding:10px;background:#f4eef8;z-index:6}
#bar button{width:100%;max-width:600px;display:flex;justify-content:space-between;background:#2e8b3d;color:#fff;border:0;border-radius:14px;padding:15px;font-size:16px;margin:auto;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.sheet{position:fixed;top:0;left:0;right:0;bottom:0;background:#f4eef8;overflow:auto;padding:14px;z-index:8}
.sheet>div{max-width:600px;margin:auto}
.q{display:flex;align-items:center;gap:8px}
.q button{width:30px;height:30px;border-radius:50%;border:1px solid #5b1f7a;background:#fff;color:#5b1f7a;font-size:18px}
label{display:block;margin:10px 0 3px;font-size:14px;font-weight:bold}
input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit;background:#fff}
.big{width:100%;background:#2e8b3d;color:#fff;border:0;border-radius:14px;padding:15px;font-size:16px;margin-top:14px}
.sec{background:#fff;border:1px solid #5b1f7a;color:#5b1f7a;border-radius:14px;padding:11px;width:100%;margin-top:8px}
.box{background:#fff;border-radius:14px;padding:14px;margin-top:10px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.st{font-family:'Fredoka',Arial,sans-serif;font-size:21px;font-weight:bold;color:#5b1f7a;margin:8px 0}
.steps{display:flex;gap:4px;margin:10px 0}
.steps i{flex:1;height:8px;border-radius:4px;background:#d8c6e3}
.steps i.on{background:#2e8b3d}
#pix{word-break:break-all;font-size:11px;background:#eee;padding:8px;border-radius:8px;margin-top:8px}
.aviso{background:#fff3cd;border:2px solid #e0a800;color:#5c4400;border-radius:12px;padding:12px;margin-top:14px;font-size:14px;text-align:center}
footer{text-align:center;font-size:13px;color:#5b1f7a;padding:16px 10px}
</style>
</head>
<body>
<header>
  <h1>10º Festival do Açaí - Arauaí</h1>
  <p>Faça o seu pedido</p>
</header>
<nav id="chips"></nav>
<main id="menu"></main>
<footer>🛵 Entregas somente na Vila do Arauaí e arredores · Sem taxa de entrega</footer>
<div id="bar" hidden><button onclick="openCart()"><span id="cnt"></span><b id="tot"></b></button></div>

<section id="cart" class="sheet" hidden><div>
  <h2>🛒 Seu pedido</h2>
  <div id="lista"></div>
  <p><b>Total: <span id="tot2"></span></b></p>
  <label>Seu nome</label><input id="nome">
  <label>Telefone / WhatsApp</label><input id="tel" type="tel">
  <label>Endereço (rua e número)</label><input id="end">
  <label>Ponto de referência</label><input id="ref">
  <label>Observações</label><textarea id="obs" rows="2"></textarea>
  <label>Pagamento</label>
  <select id="pg" onchange="document.getElementById('trocoBox').hidden=this.value!=='dinheiro'">
    <option value="pix">Pix</option>
    <option value="dinheiro">Dinheiro na entrega</option>
  </select>
  <div id="trocoBox" hidden><label>Troco para quanto? (opcional)</label><input id="troco" type="number" inputmode="decimal"></div>
  <div class="aviso">⚠️ <b>ATENÇÃO:</b> as entregas são feitas <b>somente na Vila do Arauaí e arredores</b>. Sem taxa de entrega.</div>
  <button class="big" id="enviar" onclick="enviar()">Enviar pedido</button>
  <button class="sec" onclick="closeCart()">← Voltar ao cardápio</button>
</div></section>

<section id="track" class="sheet" hidden><div>
  <h2>📦 Acompanhe seu pedido</h2>
  <div class="box"><div id="num"></div><div class="st" id="stt"></div><div class="steps" id="steps"></div></div>
  <div class="box" id="pgbox"></div>
  <div class="box" id="resumo" style="text-align:left"></div>
  <button class="sec" onclick="novo()">Fazer novo pedido</button>
</div></section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ===== DADOS DO PIX (troque aqui quando tiver a nova chave) =====
// nome: até 25 letras, MAIÚSCULAS e sem acento. cidade: sem acento.
var PIX = {chave: "+5591985741911", nome: "LUCAS MANASSES DE JESUS S", cidade: "BELEM"};
// ================================================================

// [nome, preço, pede sabor?]
var M = {
 "Restaurante":[["Churrasco de carne",7],["Churrasco de frango",7],["Churrasco misto",8],["Pirarucu",10],["Charque",8],["Camarão",8],["Peixe frito",7],["Piau assado",8]],
 "Açaí":[["Açaí porção 500ml",8],["Açaí litro",15]],
 "Lanchonete":[["Sorvete",5,1],["Picolé",4,1],["Arroz com galinha",6],["Pudim",5],["Torta salgada",7],["Lasanha",8],["Bolo Chocoloko",8],["Coxinha",4]],
 "Bebidas":[["Suco",3],["Coca-Cola 2L",12],["Fanta uva 2L",12],["Fanta laranja 2L",12],["Tuchaua 2L",9],["Splash 2L",8,1],["Água mineral",4]]
};
var SEC = {"Restaurante":"Restaurante","Açaí":"Restaurante","Lanchonete":"Lanchonete","Bebidas":"Lanchonete"};
var ST = {novo:"⏳ Aguardando aceite",aceito:"✅ Pedido aceito",preparo:"👨‍🍳 Em preparo",pronto:"📦 Pronto, aguardando saída",entrega:"🛵 Saiu para entrega",entregue:"🎉 Entregue",cancelado:"❌ Cancelado"};
var ORD = ["novo","aceito","preparo","pronto","entrega","entregue"];
function $(id){ return document.getElementById(id); }
function R(v){ return "R$ " + v.toFixed(2).replace(".", ","); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var cart = {}, unsub = null, pixKey = "", db = null;

// ---------- Cardápio (carrega primeiro) ----------
var cats = Object.keys(M), h = "", chips = "";
cats.forEach(function(c, ci){
  chips += '<button id="chip' + ci + '" class="chip" onclick="goto(' + ci + ')">' + c + '</button>';
  h += '<h2 id="sec' + ci + '">' + c + '</h2>';
  M[c].forEach(function(x, i){
    h += '<div class="it"><div class="nm">' + x[0] + '<span>' + R(x[1]) + (x[2] ? " · escolha o sabor" : "") + '</span></div><div class="ctl" id="ctl' + ci + '_' + i + '"></div></div>';
  });
});
$("chips").innerHTML = chips;
$("menu").innerHTML = h;

function goto(ci) { $("sec" + ci).scrollIntoView({behavior: "smooth", block: "start"}); }
function marca() {
  var a = 0;
  cats.forEach(function(c, ci){ if ($("sec" + ci).getBoundingClientRect().top <= 90) a = ci; });
  cats.forEach(function(c, ci){ $("chip" + ci).className = "chip" + (ci === a ? " on" : ""); });
  $("chips").scrollLeft = $("chip" + a).offsetLeft - 20;
}
window.addEventListener("scroll", marca);

function qtd(nome) { var n = 0; for (var k in cart) if (cart[k].n === nome) n += cart[k].q; return n; }
function ctlHTML(c, i) {
  var n = qtd(M[c][i][0]);
  var plus = '<button class="add" onclick="add(\'' + c + '\',' + i + ')">+</button>';
  if (!n) return plus;
  return '<button class="mn" onclick="dec(\'' + c + '\',' + i + ')">−</button><b class="qn">' + n + '</b>' + plus;
}
function add(c, i) {
  var x = M[c][i], s = "";
  if (x[2]) { s = (prompt("Qual o sabor de " + x[0] + "?") || "").trim(); if (!s) return; }
  var k = c + "|" + x[0] + "|" + s;
  if (!cart[k]) cart[k] = {n: x[0], p: x[1], q: 0, s: s, sec: SEC[c]};
  cart[k].q++;
  upd();
}
function dec(c, i) {
  var nome = M[c][i][0], ult = null;
  for (var k in cart) if (cart[k].n === nome) ult = k;
  if (ult) chg(ult, -1);
}
function chg(k, d) {
  cart[k].q += d;
  if (cart[k].q <= 0) delete cart[k];
  upd();
  if (!Object.keys(cart).length) closeCart();
}
function total() { var t = 0; for (var k in cart) t += cart[k].p * cart[k].q; return t; }
function upd() {
  var n = 0; for (var k in cart) n += cart[k].q;
  $("bar").hidden = !n;
  $("cnt").textContent = "🛒 Ver pedido (" + n + ")";
  $("tot").textContent = R(total());
  $("tot2").textContent = R(total());
  cats.forEach(function(c, ci){ M[c].forEach(function(x, i){ $("ctl" + ci + "_" + i).innerHTML = ctlHTML(c, i); }); });
  var l = "";
  Object.keys(cart).forEach(function(k){
    var x = cart[k], kk = k.replace(/'/g, "\\'");
    l += '<div class="it"><div class="nm">' + esc(x.n) + (x.s ? " – " + esc(x.s) : "") + '<span>' + R(x.p * x.q) + '</span></div><div class="q"><button onclick="chg(\'' + kk + '\',-1)">−</button>' + x.q + '<button onclick="chg(\'' + kk + '\',1)">+</button></div></div>';
  });
  $("lista").innerHTML = l;
}
function openCart() { $("cart").hidden = false; }
function closeCart() { $("cart").hidden = true; }
upd(); marca();

// ---------- Firebase (protegido) ----------
try {
  firebase.initializeApp({
    apiKey: "AIzaSyCz4k8BD-q5yGDyeKnRQ7aHNZbOcLvCTPk",
    authDomain: "festival-acai-arauai.firebaseapp.com",
    projectId: "festival-acai-arauai",
    storageBucket: "festival-acai-arauai.firebasestorage.app",
    messagingSenderId: "869331257830",
    appId: "1:869331257830:web:3b1b138e9d59e199622e27"
  });
  db = firebase.firestore();
} catch (e) { db = null; }

function enviar() {
  var nome = $("nome").value.trim(), tel = $("tel").value.trim(), end = $("end").value.trim();
  if (!nome || !tel || !end) { alert("Preencha nome, telefone e endereço."); return; }
  if (!db) { alert("Sem conexão com o sistema. Verifique a internet e recarregue a página."); return; }
  var b = $("enviar"); b.disabled = true; b.textContent = "Enviando...";
  var pg = $("pg").value, setores = {};
  var itens = Object.keys(cart).map(function(k){
    var x = cart[k];
    setores[x.sec] = "novo";
    return {nome: x.n, sabor: x.s, qtd: x.q, preco: x.p, secao: x.sec};
  });
  var p = {
    origem: "delivery", status: "novo", pago: false, setores: setores,
    cliente: {nome: nome, tel: tel, end: end, ref: $("ref").value.trim()},
    obs: $("obs").value.trim(), pagamento: pg,
    troco: pg === "dinheiro" ? (Number($("troco").value) || 0) : 0,
    itens: itens, total: total(),
    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
  };
  db.collection("pedidos").add(p).then(function(d){
    localStorage.setItem("pid", d.id);
    cart = {}; upd(); closeCart();
    acompanhar(d.id);
    b.disabled = false; b.textContent = "Enviar pedido";
  }).catch(function(e){
    alert("Não foi possível enviar o pedido: " + e.message);
    b.disabled = false; b.textContent = "Enviar pedido";
  });
}

// ---------- Acompanhar ----------
function acompanhar(id) {
  if (!db) return;
  $("track").hidden = false;
  if (unsub) unsub();
  unsub = db.collection("pedidos").doc(id).onSnapshot(function(s){
    if (!s.exists) { novo(); return; }
    var p = s.data();
    $("num").textContent = "Pedido #" + id.slice(0, 5).toUpperCase();
    $("stt").textContent = ST[p.status] || p.status;
    var i = ORD.indexOf(p.status), st = "";
    ORD.forEach(function(_, j){ st += '<i class="' + (p.status !== "cancelado" && j <= i ? "on" : "") + '"></i>'; });
    $("steps").innerHTML = st;
    pagBox(p);
    $("resumo").innerHTML = "<b>Resumo</b><br>" + p.itens.map(function(x){
      return x.qtd + "x " + esc(x.nome) + (x.sabor ? " – " + esc(x.sabor) : "");
    }).join("<br>") + "<br><b>Total: " + R(p.total) + "</b><br>Entrega: " + esc(p.cliente.end);
  }, function(){ });
}
function pagBox(p) {
  var el = $("pgbox");
  if (p.pagamento === "dinheiro") {
    el.innerHTML = "💵 Pagamento em dinheiro na entrega" + (p.troco ? "<br>Troco para " + R(p.troco) : "");
    pixKey = ""; return;
  }
  if (p.pago) { el.innerHTML = "✅ Pix confirmado. Obrigado!"; pixKey = ""; return; }
  var code = brcode(p.total);
  if (pixKey === code) return;
  pixKey = code;
  el.innerHTML = "<b>Pague com Pix: " + R(p.total) + '</b><div id="qr" style="display:flex;justify-content:center;margin:10px"></div><div id="pix">' + code + '</div><button class="sec" onclick="copiar()">Copiar código Pix</button><p style="font-size:13px">A equipe confirma o pagamento pelo comprovante.</p>';
  try { new QRCode($("qr"), {text: code, width: 200, height: 200}); } catch (e) {}
}
function copiar() {
  try { navigator.clipboard.writeText(pixKey).then(function(){ alert("Código copiado!"); }); }
  catch (e) { alert("Segure o texto do código para copiar."); }
}
function novo() {
  if (unsub) unsub();
  unsub = null; pixKey = "";
  localStorage.removeItem("pid");
  $("track").hidden = true;
}

// ---------- Pix (BR Code) ----------
function f(id, v) { return id + ("0" + v.length).slice(-2) + v; }
function crc(s) {
  var c = 0xFFFF;
  for (var i = 0; i < s.length; i++) {
    c ^= s.charCodeAt(i) << 8;
    for (var j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF;
  }
  return ("000" + c.toString(16).toUpperCase()).slice(-4);
}
function brcode(v) {
  var s = f("00", "01") + f("01", "12") +
    f("26", f("00", "br.gov.bcb.pix") + f("01", PIX.chave)) +
    f("52", "0000") + f("53", "986") + f("54", v.toFixed(2)) + f("58", "BR") +
    f("59", PIX.nome.slice(0, 25)) + f("60", PIX.cidade) + f("62", f("05", "***")) + "6304";
  return s + crc(s);
}

// retomar pedido em andamento
try { var pid = localStorage.getItem("pid"); if (pid) acompanhar(pid); } catch (e) {}

// ===== ESGOTADOS / PAUSA (definido pelo administrador) =====
var CFG = {pausado: false, esgotados: []};
function esg(n) { return CFG.esgotados.indexOf(n) >= 0; }
var _ctl = ctlHTML;
ctlHTML = function(c, i) {
  if (esg(M[c][i][0])) return '<span style="color:#b00020;font-weight:bold;font-size:13px">ESGOTADO</span>';
  return _ctl(c, i);
};
var _env = enviar;
enviar = function() {
  if (CFG.pausado) { alert("No momento não estamos recebendo pedidos de delivery."); return; }
  var ruim = [];
  for (var k in cart) if (esg(cart[k].n) && ruim.indexOf(cart[k].n) < 0) ruim.push(cart[k].n);
  if (ruim.length) { alert("Item esgotado, remova do pedido: " + ruim.join(", ")); return; }
  _env();
};
(function(){
  var b = document.createElement("div");
  b.hidden = true;
  b.style.cssText = "background:#b00020;color:#fff;text-align:center;padding:12px;font-weight:bold";
  b.textContent = "⏸️ Estamos sem receber pedidos de delivery no momento. Tente novamente em instantes.";
  document.body.insertBefore(b, document.querySelector("header").nextSibling);
  if (db) db.collection("config").doc("estado").onSnapshot(function(s){
    var d = s.exists ? s.data() : {};
    CFG.pausado = !!d.pausado; CFG.esgotados = d.esgotados || [];
    b.hidden = !CFG.pausado; upd();
  }, function(){});
})();
// ===== CARDÁPIO DINÂMICO (editado pelo administrador) =====
function montarMenu() {
  cats = Object.keys(M);
  var h = "", chips = "";
  cats.forEach(function(c, ci){
    chips += '<button id="chip' + ci + '" class="chip" onclick="goto(' + ci + ')">' + esc(c) + '</button>';
    h += '<h2 id="sec' + ci + '">' + esc(c) + '</h2>';
    M[c].forEach(function(x, i){
      h += '<div class="it"><div class="nm">' + esc(x[0]) + '<span>' + R(x[1]) + (x[2] ? " · escolha o sabor" : "") + '</span></div><div class="ctl" id="ctl' + ci + '_' + i + '"></div></div>';
    });
  });
  $("chips").innerHTML = chips;
  $("menu").innerHTML = h;
  Object.keys(cart).forEach(function(k){
    var cat = k.split("|")[0], achou = null;
    (M[cat] || []).forEach(function(x){ if (x[0] === cart[k].n) achou = x; });
    if (!achou) delete cart[k]; else cart[k].p = achou[1];
  });
  upd(); marca();
}
if (db) db.collection("config").doc("cardapio").onSnapshot(function(s){
  if (!s.exists || !s.data().cats) return;
  var nm = {}, ns = {};
  s.data().cats.forEach(function(c){
    if (!c.itens || !c.itens.length) return;
    nm[c.nome] = c.itens.map(function(x){ return x.s ? [x.n, Number(x.p) || 0, 1] : [x.n, Number(x.p) || 0]; });
    ns[c.nome] = c.setor;
  });
  if (!Object.keys(nm).length) return;
  M = nm; SEC = ns;
  montarMenu();
}, function(){});
</script>
</body>
</html>
